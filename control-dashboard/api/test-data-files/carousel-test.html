<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-slider {
            height: 80vh;
            position: relative;
            overflow: hidden;
        }
        
        .carousel-inner {
            height: 100%;
        }
        
        .carousel-item {
            height: 100%;
        }
        
        .hero-slide {
            height: 80vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <section class="hero-slider">
        <div id="testCarousel" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="hero-slide" style="background-image: url('control-dashboard/uploads/materials/sliders/6982c59c5ecc7_1770177948.jpg');"></div>
                </div>
                <div class="carousel-item">
                    <div class="hero-slide" style="background-image: url('control-dashboard/uploads/materials/sliders/6982c5abe6916_1770177963.jpg');"></div>
                </div>
                <div class="carousel-item">
                    <div class="hero-slide" style="background-image: url('control-dashboard/uploads/materials/sliders/6982c5b69bab7_1770177974.jpg');"></div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#testCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#testCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const carousel = new bootstrap.Carousel(document.getElementById('testCarousel'), {
            interval: 5000,
            wrap: true
        });
    </script>
</body>
</html>
